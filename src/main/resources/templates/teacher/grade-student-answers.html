<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>تصحیح پاسخ دانشجو</title>
    <style>
        body {
            font-family: Arial;
            margin: 20px;
            background: #f5f5f5;
        }
        .header {
            background: #333;
            color: white;
            padding: 15px;
            margin-bottom: 20px;
        }
        .header a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
        }
        .answer-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border: 1px solid #ddd;
        }
        .answer-item {
            border: 1px solid #ddd;
            padding: 20px;
            margin: 20px 0;
        }
        .question-title {
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
            font-size: 18px;
        }
        .question-text {
            color: #333;
            line-height: 1.6;
            margin-bottom: 15px;
            padding: 15px;
            background: #f8f9fa;
        }
        .student-answer {
            margin: 20px 0;
            padding: 15px;
            background: #f8f9fa;
            border: 1px solid #ddd;
            white-space: pre-wrap;
            line-height: 1.6;
        }
        .grading-form {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px dashed #ddd;
        }
        .score-input {
            width: 100px;
            padding: 8px;
            margin: 0 10px;
        }
        .max-score {
            color: #666;
            font-size: 14px;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            color: white;
            cursor: pointer;
            margin: 5px;
        }
        .btn-save {
            background: #28a745;
        }
        .success {
            color: green;
            padding: 10px;
            background: #d4edda;
            border: 1px solid #c3e6cb;
            margin: 10px 0;
        }
        .error {
            color: #721c24;
            padding: 10px;
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            margin: 10px 0;
        }
        .no-answers {
            text-align: center;
            padding: 50px;
            color: #666;
        }
        .already-graded {
            color: green;
            padding: 10px;
            background: #d4edda;
            border: 1px solid #c3e6cb;
            margin: 10px 0;
        }
    </style>
</head>
<body>
<div class="header">
    <a href="/teacher/dashboard">داشبورد</a>
</div>

<div class="answer-container">
    <h2>📝 تصحیح پاسخ‌های دانشجو</h2>

    <div th:if="${successMessage}" class="success">
        <span th:text="${successMessage}"></span>
    </div>

    <div th:if="${errorMessage}" class="error">
        <span th:text="${errorMessage}"></span>
    </div>

    <div th:if="${answers.empty}" class="no-answers">
        <p>هیچ پاسخ تشریحی برای تصحیح وجود ندارد.</p>
        <p>یا تمام پاسخ‌ها تصحیح شده‌اند یا این آزمون فقط سوالات چندگزینه‌ای دارد.</p>
    </div>

    <div th:each="answer : ${answers}">
        <div class="answer-item">
            <div class="question-title">
                سوال: <span th:text="${answer.examQuestion.question.title}"></span>
            </div>

            <div class="question-text" th:text="${answer.examQuestion.question.questionText}"></div>

            <div>
                <strong>پاسخ دانشجو:</strong>
                <div class="student-answer" th:text="${answer.answerText}"></div>
            </div>

            <div th:if="${answer.isGraded}" class="already-graded">
                ✓ این سوال قبلاً تصحیح شده است. نمره:
                <strong th:text="${answer.score}"></strong> از
                <span th:text="${answer.examQuestion.defaultScore}"></span>
            </div>

            <div th:unless="${answer.isGraded}" class="grading-form">
                <form th:action="@{/teacher/grading/answer/{id}/grade(id=${answer.id})}"
                      method="post">
                    <input type="hidden" name="participationId" th:value="${participationId}">

                    <label for="score-${answer.id}">تعیین نمره:</label>
                    <input type="number" id="score-${answer.id}" name="score"
                           th:value="${answer.examQuestion.defaultScore}"
                           step="0.5" min="0"
                           th:max="${answer.examQuestion.defaultScore}"
                           class="score-input" required>

                    <span class="max-score">
                            از <span th:text="${answer.examQuestion.defaultScore}"></span>
                        </span>

                    <button type="submit" class="btn btn-save">💾 ذخیره نمره</button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
