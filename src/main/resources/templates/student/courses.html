<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>دوره‌های من</title>
    <style>
        body {
            font-family: Arial;
            margin: 20px;
            background: #f5f5f5;
        }
        .header {
            background: #333;
            color: white;
            padding: 15px;
            margin-bottom: 20px;
        }
        .header a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: right;
        }
        th {
            background: #f8f9fa;
        }
        .btn {
            padding: 8px 15px;
            text-decoration: none;
            color: white;
            margin: 0 3px;
        }
        .btn-exams {
            background: #28a745;
        }
        .no-courses {
            text-align: center;
            padding: 50px;
            color: #666;
            background: white;
            border: 1px solid #ddd;
        }
        .status-active {
            color: green;
            font-weight: bold;
        }
        .status-ended {
            color: red;
        }
    </style>
</head>
<body>
<div class="header">
    <a href="/student/dashboard">داشبورد</a>
    <a href="/student/courses">دوره‌های من</a>
    <form th:action="@{/logout}" method="post">
        <button type="submit">خروج</button>
    </form>
</div>

<h2>📚 دوره‌های ثبت‌نام شده</h2>

<div th:if="${courses.empty}" class="no-courses">
    <p>شما در هیچ دوره‌ای ثبت‌نام نکرده‌اید.</p>
    <p>لطفاً با مدیر سیستم تماس بگیرید.</p>
</div>

<div th:unless="${courses.empty}">
    <table>
        <thead>
        <tr>
            <th>عنوان دوره</th>
            <th>کد دوره</th>
            <th>استاد</th>
            <th>تاریخ شروع</th>
            <th>تاریخ پایان</th>
            <th>وضعیت</th>
            <th>عملیات</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="course : ${courses}">
            <td th:text="${course.title}"></td>
            <td th:text="${course.courseCode}"></td>
            <td th:text="${course.teacher.firstName + ' ' + course.teacher.lastName}"></td>
            <td th:text="${#temporals.format(course.startDate, 'yyyy/MM/dd')}"></td>
            <td th:text="${#temporals.format(course.endDate, 'yyyy/MM/dd')}"></td>
            <td>
                        <span th:if="${course.endDate.isAfter(T(java.time.LocalDate).now())}"
                              class="status-active">در حال برگزاری</span>
                <span th:unless="${course.endDate.isAfter(T(java.time.LocalDate).now())}"
                      class="status-ended">پایان یافته</span>
            </td>
            <td>
                <a th:href="@{/student/courses/{id}/exams(id=${course.id})}"
                   class="btn btn-exams">📝 آزمون‌ها</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
